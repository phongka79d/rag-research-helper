name: rag-research-helper

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: rag_research_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  neo4j:
    image: neo4j:5.26-community
    container_name: rag_research_neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: "${NEO4J_USER}/${NEO4J_PASSWORD}"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

volumes:
  qdrant_data:
    name: rag-research-helper_qdrant_data
  neo4j_data:
    name: rag-research-helper_neo4j_data
  neo4j_logs:
    name: rag-research-helper_neo4j_logs
